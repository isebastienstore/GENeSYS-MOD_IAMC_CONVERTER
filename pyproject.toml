[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesysmod-iamc-converter"
version = "0.1.0"
description = "GENeSYS-MOD input and output conversion to IAMC"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "openpyxl>=3.1", "PyYAML>=6"]

[project.scripts]
genesysmod-iamc = "genesysmod_iamc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genesysmod_iamc = ["profiles/*.yaml", "profiles/*.txt"]
